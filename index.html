<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="הכחולים נגד האדומים">
<title>הכחולים נגד האדומים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --page-bg:#4a2f1d;--page-bg-2:#1f130b;
  --panel:#fff7ec;--panel-ink:#3a2617;--panel-soft:#8a6a4f;--panel-edge:#dcb78f;
  --tile:#ffffff;--tile-edge:#ead5b8;--tile-ink:#6b4b31;
  --blue:#2f7cf6;--blue-dark:#123f9c;--blue-soft:#e3eeff;
  --red:#e53935;--red-dark:#7f1010;--red-soft:#ffe6e3;
  --orange:#ff8a00;--orange-dark:#c45f00;
  --green:#2fbf5b;--green-dark:#1b7f3a;
  --gold:#ffd23f;--gold-dark:#c99a00;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--page-bg:#22150d;--page-bg-2:#0c0704;color-scheme:dark}}
:root[data-theme="dark"]{--page-bg:#22150d;--page-bg-2:#0c0704;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;touch-action:none}
body{position:relative;background-color:var(--page-bg-2);background-image:radial-gradient(ellipse at center,var(--page-bg) 0%,var(--page-bg-2) 75%);font-family:'Rubik',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;color:var(--panel-ink);user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{-webkit-appearance:none;appearance:none}
#stage{position:absolute;left:50%;top:50%;width:540px;height:960px;transform:translate(-50%,-50%);border-radius:22px;overflow:hidden;background:#e7b88a;box-shadow:0 24px 70px rgba(0,0,0,.5)}
#game{position:absolute;left:0;top:0;width:540px;height:960px;display:block;touch-action:none;cursor:crosshair}
#lvlBtn{position:absolute;top:12px;left:50%;transform:translateX(-50%);height:34px;padding:0 14px;border-radius:999px;border:2px solid rgba(255,255,255,.3);background:rgba(45,22,10,.55);color:#fff;font:800 16px 'Rubik',sans-serif;display:flex;align-items:center;gap:8px;cursor:pointer;z-index:2}
#lvlBtn svg{width:13px;height:13px;flex:none}
.power{position:absolute;right:6px;width:62px;height:62px;border-radius:50%;border:3px solid #fff;display:none;align-items:center;justify-content:center;font-size:30px;line-height:1;cursor:pointer;z-index:3;padding:0}
.power:active{transform:translateY(3px)}
.power .cnt{position:absolute;bottom:-6px;left:-6px;min-width:24px;height:24px;border-radius:12px;background:#2b1408;color:#fff;font:900 14px/20px 'Rubik',sans-serif;text-align:center;border:2px solid #fff}
#bombBtn{top:748px;background:radial-gradient(circle at 35% 30%,#ff8a65,#d84315);box-shadow:0 5px 0 #8a2a0b,0 8px 18px rgba(0,0,0,.35)}
#freezeBtn{top:672px;background:radial-gradient(circle at 35% 30%,#c4ecff,#1e88e5);box-shadow:0 5px 0 #0d4f8c,0 8px 18px rgba(0,0,0,.35)}
#setupTip{position:absolute;left:0;right:0;top:232px;display:none;justify-content:center;pointer-events:none;z-index:3}
#setupTip span{background:rgba(45,22,10,.8);color:#fff;font:800 17px/1.3 'Rubik',sans-serif;padding:8px 18px;border-radius:999px;max-width:470px;text-align:center}
#setupBar{position:absolute;left:0;right:0;bottom:20px;display:none;justify-content:center;pointer-events:none;z-index:3}
#setupBar .big{pointer-events:auto}
.overlay{position:absolute;top:0;left:0;right:0;bottom:0;display:none;align-items:center;justify-content:center;background:rgba(40,18,6,.5);z-index:5}
.overlay.show{display:flex}
.panel{width:508px;background:var(--panel);border-radius:26px;padding:16px 16px 20px;text-align:center;box-shadow:0 8px 0 var(--panel-edge),0 22px 50px rgba(0,0,0,.4)}
.panel.small{width:420px;padding:22px 20px 24px}
.title{margin:0;font:900 44px/1.1 'Rubik',sans-serif}
.title .b{color:var(--blue);text-shadow:0 3px 0 var(--blue-dark)}
.title .r{color:var(--red);text-shadow:0 3px 0 var(--red-dark)}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;margin:4px 0 2px}
.vs b{font:900 22px 'Rubik',sans-serif}
.vsbtn{border:3px solid transparent;background:transparent;border-radius:18px;padding:4px 12px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;font:800 14px 'Rubik',sans-serif;color:var(--panel-soft)}
.vsbtn canvas{width:76px;height:76px}
.vsbtn.on.blue{border-color:var(--blue);background:var(--blue-soft);color:var(--blue-dark)}
.vsbtn.on.red{border-color:var(--red);background:var(--red-soft);color:var(--red-dark)}
.sub{margin:2px 10px 4px;font:500 15px/1.4 'Rubik',sans-serif;color:var(--panel-soft)}
h2{margin:8px 4px 6px;font:800 17px 'Rubik',sans-serif;display:flex;align-items:center;gap:8px}
h2 i{width:14px;height:14px;border-radius:50%;display:inline-block}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{position:relative;border:3px solid transparent;background:var(--tile);border-radius:14px;padding:2px 0 4px;cursor:pointer;box-shadow:0 3px 0 var(--tile-edge);display:flex;flex-direction:column;align-items:center;font:700 12px 'Rubik',sans-serif;color:var(--tile-ink);transition:transform .12s}
.tile canvas{width:54px;height:54px}
.tile span{white-space:nowrap}
.tile em{position:absolute;top:-7px;left:-5px;background:var(--gold);color:#5a3a00;font:900 10px 'Rubik',sans-serif;font-style:normal;padding:2px 6px;border-radius:999px;box-shadow:0 2px 0 var(--gold-dark);transform:rotate(-8deg)}
.tile:hover{transform:translateY(-2px)}
.tile.blue.sel{border-color:var(--blue);background:var(--blue-soft)}
.tile.red.sel{border-color:var(--red);background:var(--red-soft)}
.row{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin:12px 0 0}
.diff{display:flex;gap:6px}
.diff button{border:3px solid var(--tile-edge);background:var(--tile);border-radius:999px;padding:6px 16px;font:800 16px 'Rubik',sans-serif;color:var(--tile-ink);cursor:pointer}
.diff button.sel{background:var(--green);border-color:var(--green-dark);color:#fff}
.diffnote{font:600 13px 'Rubik',sans-serif;color:var(--panel-soft);margin-top:6px;min-height:16px}
.lvlpick{display:flex;align-items:center;gap:6px;background:var(--tile);border:3px solid var(--tile-edge);border-radius:999px;padding:3px}
.lvlpick button{width:30px;height:30px;border-radius:50%;border:0;background:var(--orange);color:#fff;font:900 20px/1 'Rubik',sans-serif;cursor:pointer}
.lvlpick button:disabled{background:#e4d3bd;cursor:default}
.lvlpick span{font:800 16px 'Rubik',sans-serif;color:var(--tile-ink);min-width:60px;text-align:center}
.btns{display:flex;gap:12px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:14px}
.big{border:0;margin:0;padding:14px 40px;border-radius:20px;font:900 26px 'Rubik',sans-serif;color:#fff;background:var(--orange);box-shadow:0 7px 0 var(--orange-dark);cursor:pointer}
.big:active{transform:translateY(4px);box-shadow:0 3px 0 var(--orange-dark)}
.big.green{background:var(--green);box-shadow:0 7px 0 var(--green-dark)}
.big.green:active{box-shadow:0 3px 0 var(--green-dark)}
.big.blue{background:var(--blue);box-shadow:0 7px 0 var(--blue-dark)}
.big.blue:active{box-shadow:0 3px 0 var(--blue-dark)}
.panel.small .big{padding:12px 26px;font-size:22px}
.pulse{animation:pulse 1.1s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@media (prefers-reduced-motion: reduce){.pulse{animation:none}}
.link{border:0;background:none;margin:14px auto 0;font:700 16px 'Rubik',sans-serif;color:var(--panel-soft);text-decoration:underline;cursor:pointer;display:block}
.result{font:900 52px/1.1 'Rubik',sans-serif;margin:0 0 6px}
.result.win{color:var(--green);text-shadow:0 4px 0 var(--green-dark)}
.result.lose{color:var(--red);text-shadow:0 4px 0 var(--red-dark)}
.result.plain{color:var(--panel-ink)}
.stars{display:flex;justify-content:center;gap:6px;margin:0 0 6px;font-size:48px;line-height:1}
.stars i{font-style:normal;color:#e4d3bd;text-shadow:0 3px 0 #c9b391}
.stars i.on{color:#ffc83d;text-shadow:0 3px 0 #c99a00}
.stats{font:700 18px/1.4 'Rubik',sans-serif;color:var(--panel-soft);margin:4px 0}
.stats.hint{color:var(--green-dark)}
.note{font:600 15px/1.4 'Rubik',sans-serif;color:var(--panel-soft);margin:2px 0}
.shop-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 12px}
.shop-head .result{font-size:40px;margin:0}
.coins{display:flex;align-items:center;gap:8px;background:#3a2617;color:#fff;font:900 22px 'Rubik',sans-serif;padding:6px 14px;border-radius:999px}
.coin{display:inline-block;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff3b0 0 20%,#ffc83d 24%);border:2px solid #b77f00;flex:none}
.shop-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.item{display:flex;align-items:center;gap:7px;background:var(--tile);border-radius:16px;padding:8px;box-shadow:0 3px 0 var(--tile-edge);text-align:right}
.item .ico{width:44px;height:44px;flex:none;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1;background:#fff3e0;border-radius:12px}
.item .ico canvas{width:44px;height:44px}
.item .txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.item b{font:800 16px/1.2 'Rubik',sans-serif;color:var(--panel-ink)}
.item small{font:500 13px/1.25 'Rubik',sans-serif;color:var(--panel-soft)}
.lvl{display:flex;align-items:center;gap:6px;margin-top:3px}
.lvl .bar{flex:1;height:7px;border-radius:4px;background:#ead5b8;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--green);border-radius:4px}
.lvl span{font:800 11px 'Rubik',sans-serif;color:var(--tile-ink);direction:ltr;unicode-bidi:isolate}
.have{font:700 12px 'Rubik',sans-serif;color:var(--tile-ink);margin-top:2px}
.buy{border:0;border-radius:12px;padding:8px;min-width:66px;display:flex;align-items:center;justify-content:center;gap:4px;font:900 16px 'Rubik',sans-serif;color:#fff;background:var(--green);box-shadow:0 4px 0 var(--green-dark);cursor:pointer;flex:none}
.buy .coin{width:15px;height:15px}
.buy:active{transform:translateY(3px);box-shadow:0 1px 0 var(--green-dark)}
.buy:disabled{background:#d9c8b1;box-shadow:0 4px 0 #bba78c;cursor:default;transform:none}
.buy.max{background:#b48cff;box-shadow:0 4px 0 #7d55cf;font-size:13px}
</style>
</head>
<body>
<div id="stage" dir="rtl" lang="he">
  <canvas id="game"></canvas>
  <button id="lvlBtn" type="button" aria-label="הפסקה"><svg viewBox="0 0 14 14" aria-hidden="true"><rect x="2" y="1" width="3.5" height="12" rx="1" fill="#fff"/><rect x="8.5" y="1" width="3.5" height="12" rx="1" fill="#fff"/></svg><span id="lvlTxt">שלב 1</span></button>
  <button id="freezeBtn" class="power" type="button" aria-label="הקפאה"><span aria-hidden="true">❄️</span><span class="cnt" id="freezeCount">0</span></button>
  <button id="bombBtn" class="power" type="button" aria-label="פצצה"><span aria-hidden="true">💣</span><span class="cnt" id="bombCount">0</span></button>
  <div id="setupTip"><span>גררו את התותחים והחומות למקום שאתם רוצים</span></div>
  <div id="setupBar"><button class="big green" id="setupGo" type="button">לקרב!</button></div>

  <div id="menu" class="overlay show">
    <div class="panel">
      <h1 class="title"><span class="b">הכחולים</span> נגד <span class="r">האדומים</span></h1>
      <div class="vs">
        <button type="button" class="vsbtn blue" id="vsBlueBtn"><canvas id="vsBlue" width="160" height="160"></canvas><span>הצבא שלי</span></button>
        <b>נגד</b>
        <button type="button" class="vsbtn red" id="vsRedBtn"><canvas id="vsRed" width="160" height="160"></canvas><span>הרעים</span></button>
      </div>
      <p class="sub">יורים חיילים, עוברים בשערים כדי להכפיל אותם, והורסים את הבתים האדומים!</p>
      <h2><i id="pickDot"></i><span id="pickHint"></span></h2>
      <div class="grid" id="pickGrid"></div>
      <div class="row">
        <div class="diff" id="diff"><button type="button" data-d="easy">קל</button><button type="button" data-d="normal">רגיל</button><button type="button" data-d="hard">קשה</button></div>
        <div class="lvlpick" dir="ltr"><button type="button" id="lvlMinus" aria-label="שלב קודם">-</button><span id="lvlShow" dir="rtl">שלב 1</span><button type="button" id="lvlPlus" aria-label="שלב הבא">+</button></div>
      </div>
      <div class="diffnote" id="diffNote"></div>
      <div class="btns">
        <button class="big" id="playBtn" type="button">יאללה לקרב!</button>
        <button class="big blue" id="shopBtn1" type="button">🛒 חנות</button>
      </div>
    </div>
  </div>

  <div id="pause" class="overlay">
    <div class="panel small">
      <div class="result plain">הפסקה</div>
      <div class="btns"><button class="big green" id="resumeBtn" type="button">להמשיך</button></div>
      <button class="link" id="soundBtn" type="button">צלילים: פועלים</button>
      <button class="link" id="menuBtn1" type="button">לתפריט הדמויות</button>
    </div>
  </div>

  <div id="win" class="overlay">
    <div class="panel small">
      <div class="result win">ניצחון!</div>
      <div class="stars" id="winStars"><i>★</i><i>★</i><i>★</i></div>
      <div class="stats" id="winStats"></div>
      <div class="note" id="winNote"></div>
      <div class="stats hint" id="winHint"></div>
      <div class="btns">
        <button class="big green" id="nextBtn" type="button">לשלב הבא</button>
        <button class="big blue" id="shopBtn2" type="button">🛒 חנות</button>
      </div>
      <button class="link" id="menuBtn2" type="button">החלפת דמויות</button>
    </div>
  </div>

  <div id="lose" class="overlay">
    <div class="panel small">
      <div class="result lose">אוי! הם פרצו</div>
      <div class="stats" id="loseStats"></div>
      <div class="btns">
        <button class="big" id="retryBtn" type="button">לנסות שוב</button>
        <button class="big blue" id="shopBtn3" type="button">🛒 חנות</button>
      </div>
      <button class="link" id="menuBtn3" type="button">החלפת דמויות</button>
    </div>
  </div>

  <div id="shop" class="overlay">
    <div class="panel">
      <div class="shop-head">
        <div class="result plain">חנות</div>
        <div class="coins"><i class="coin"></i><span id="shopCoins">0</span></div>
      </div>
      <div class="shop-grid" id="shopGrid"></div>
      <div class="btns"><button class="big green" id="shopBack" type="button">חזרה</button></div>
    </div>
  </div>
</div>

<script>
(() => {
'use strict';

// ---------- helpers ----------
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const $ = id => document.getElementById(id);
function newCanvas(w, h) { const c = document.createElement('canvas'); c.width = w; c.height = h || w; return c; }
function circ(g, x, y, r) { g.beginPath(); g.arc(x, y, Math.max(0.1, r), 0, Math.PI * 2); }
function ell(g, x, y, rx, ry) { g.beginPath(); g.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), 0, 0, Math.PI * 2); }
function rr(g, x, y, w, h, r) {
  w = Math.max(0, w); h = Math.max(0, h);
  r = Math.max(0, Math.min(r, w / 2, h / 2));
  g.beginPath();
  g.moveTo(x + r, y);
  g.arcTo(x + w, y, x + w, y + h, r);
  g.arcTo(x + w, y + h, x, y + h, r);
  g.arcTo(x, y + h, x, y, r);
  g.arcTo(x, y, x + w, y, r);
  g.closePath();
}
function seg(g, x1, y1, x2, y2) { g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke(); }
function distSeg(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const l2 = dx * dx + dy * dy;
  const t = l2 ? clamp(((px - x1) * dx + (py - y1) * dy) / l2, 0, 1) : 0;
  return Math.hypot(px - (x1 + dx * t), py - (y1 + dy * t));
}

// ---------- constants ----------
const W = 540, H = 960;
const ARENA_L = 34, ARENA_R = W - 34;
const TOWER_Y = 170, LINE_Y = 858, CANNON_Y = 912;
const MAX_BLUE = 450, MAX_RED = 280, MAX_PARTICLES = 1400;
const CELL = 46, GCOLS = Math.ceil(W / CELL), GROWS = Math.ceil(H / CELL);
const SPR = 128;
const TURRET_R = 28, WALL_W = 150, WALL_T = 12;
const EMOJI_FONT = '"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif';
const UI_FONT = 'Rubik, system-ui, sans-serif';

const TEAM = [
  { main: '#2f7cf6', dark: '#0f3a94', light: '#a9d0ff' },
  { main: '#e53935', dark: '#7a0e0e', light: '#ffaba3' },
];

// Favorite picks first. 'people' = eyes only, no nose and no mouth.
// Characters with draw() are original cartoon characters drawn in code.
const CHARS = [
  { id: 'people', name: "אנשים", draw: (g, x, y, R, c) => drawPerson(g, x, y, R, c, false) },
  { id: 'soldier', name: "חיילים", draw: (g, x, y, R, c) => drawPerson(g, x, y, R, c, true) },
  { id: 'teddy', name: "דובונים", e: '🧸' },
  { id: 'dino', name: "דינוזאורים", e: '🦖' },
  { id: 'robot', name: "רובוטים", e: '🤖' },
  { id: 'ninja', name: "נינג'ות", e: '🥷' },
  { id: 'horse', name: "סוסים", e: '🐎', isNew: true },
  { id: 'tiger', name: "נמרים", e: '🐅', isNew: true },
  { id: 'pupi', name: "פופי", draw: drawPupi, isNew: true },
  { id: 'glidon', name: "גלידון", draw: drawGlidon, isNew: true },
  { id: 'donato', name: "דונטו", draw: drawDonato, isNew: true },
  { id: 'kaktusi', name: "קקטוסי", draw: drawKaktusi, isNew: true },
  { id: 'ziki', name: "זיקי", draw: drawZiki, isNew: true },
  { id: 'ugi', name: "אוגי", draw: drawUgi, isNew: true },
  { id: 'alien', name: "חייזרים", e: '👽' },
  { id: 'zombie', name: "זומבים", e: '🧟' },
  { id: 'dragon', name: "דרקונים", e: '🐉' },
  { id: 'shark', name: "כרישים", e: '🦈' },
  { id: 'panda', name: "פנדות", e: '🐼' },
  { id: 'unicorn', name: "חדי קרן", e: '🦄' },
];

// coins: reward multiplier, so playing on hard pays more
const DIFF = {
  easy: { spawn: 0.6, base: 30, giant: 0.8, coins: 0.8 },
  normal: { spawn: 1, base: 20, giant: 1, coins: 1 },
  hard: { spawn: 1.45, base: 12, giant: 1.3, coins: 1.3 },
};
const DIFF_NOTE = { easy: "במצב קל מקבלים פחות מטבעות", normal: "", hard: "במצב קשה מקבלים 30% יותר מטבעות" };

// walls: [x1, y1, x2, y2] | barrels: [x, y, r] | gates: m = multiplier, s = speed of a moving gate
// pads: where the extra cannons start before the player moves them
const LAYOUTS = [
  {
    walls: [[180, 285, 155, 345], [360, 285, 385, 345], [272, 420, 272, 560]],
    barrels: [[270, 300, 20], [458, 600, 17], [82, 610, 17]],
    gates: [
      { x: 110, y: 470, w: 120, m: 3 },
      { x: 412, y: 450, w: 112, m: 2 },
      { x: 270, y: 690, w: 130, m: 2, min: 120, max: 420, s: 55 },
    ],
    pads: [[380, 590], [165, 590], [270, 625]],
  },
  {
    walls: [[150, 330, 205, 375], [390, 330, 335, 375], [270, 560, 270, 620]],
    barrels: [[90, 565, 18], [450, 565, 18]],
    gates: [
      { x: 270, y: 470, w: 120, m: 3, min: 140, max: 400, s: 70 },

let actx = null, master = null, noiseBuf = null;

const lastSfx = {};
const GAP = { shoot: 0.06, pop: 0.035, gate: 0.06, hit: 0.05, boom: 0.09, hurt: 0.12, shield: 0.05, chip: 0.12 };
function sfx(n) {

  const t = actx.currentTime;
  if (t - (lastSfx[n] || -1) < (GAP[n] || 0)) return;
  lastSfx[n] = t;
  switch (n) {
    case 'shoot': tone('square', 380, 180, 0.07, 0.04); break;
    case 'pop': tone('triangle', 900 + Math.random() * 300, 300, 0.06, 0.06); break;
    case 'gate': tone('sine', 700, 1400, 0.09, 0.06); break;
    case 'hit': noise(0.07, 0.15, 2400); break;
    case 'chip': noise(0.05, 0.08, 3200); break;
    case 'boom': noise(0.6, 0.5, 1400); tone('sine', 140, 40, 0.5, 0.35); break;
    case 'hurt': tone('sawtooth', 220, 90, 0.18, 0.08); break;
    case 'shield': tone('square', 1800, 1200, 0.05, 0.03); break;
    case 'whistle': tone('sine', 1500, 450, 0.6, 0.06); break;
    case 'freeze': tone('sine', 1800, 2600, 0.25, 0.05); tone('triangle', 1300, 900, 0.45, 0.04, 0.06); break;
    case 'place': tone('triangle', 660, 990, 0.09, 0.07); break;
    case 'nope': tone('square', 220, 160, 0.14, 0.05); break;
    case 'buy': tone('square', 988, 988, 0.07, 0.05); tone('square', 1319, 1319, 0.14, 0.05, 0.07); break;
    case 'super': [0, 1, 2].forEach(i => tone('square', 520 * Math.pow(1.26, i), 520 * Math.pow(1.26, i), 0.09, 0.05, i * 0.08)); break;

function tone(type, f0, f1, dur, vol, delay) {

// ---------- defenses the player places (positions remembered per layout) ----------
function placeDefenses(n) {

function spotOk(kind, item, x, y) {

  }
  if (x - WALL_W / 2 < ARENA_L + 1 || x + WALL_W / 2 > ARENA_R - 1 || y < 380 || y > 830) return false;
  for (let px = x - WALL_W / 2; px <= x + WALL_W / 2 + 0.1; px += 15) if (!clearAt(px, y, WALL_T + 4, item)) return false;

}
function clearAt(x, y, r, self) {

  for (const b of barrels) if (Math.hypot(x - b.x, y - b.y) < r + b.r) return false;

// ---------- update ----------
function moveGates(dt) {
  for (const g of gates) {
    g.pulse = Math.max(0, g.pulse - dt * 4);
    if (!g.speed) continue;
    g.x += g.speed * g.dir * dt;
    if (g.x < g.min) { g.x = g.min; g.dir = 1; } else if (g.x > g.max) { g.x = g.max; g.dir = -1; }
  }
}
function idle(dt) { time += dt; moveGates(dt); updateFx(dt); }
function update(dt) {
  time += dt;
  const playing = state === 'playing';
  if (keyL) cannon.tx -= 430 * dt;
  if (keyR) cannon.tx += 430 * dt;
  cannon.tx = clamp(cannon.tx, ARENA_L + 36, ARENA_R - 36);
  cannon.x += (cannon.tx - cannon.x) * Math.min(1, dt * 16);
  cannon.recoil = Math.max(0, cannon.recoil - dt * 50);
  cannon.flash = Math.max(0, cannon.flash - dt * 9);
  shake = Math.max(0, shake - dt * 30);
  hurt = Math.max(0, hurt - dt * 2);
  freezeT = Math.max(0, freezeT - dt);
  freezeFlash = Math.max(0, freezeFlash - dt * 2);
  hintT -= dt;
  fireTimer -= dt;
  if (playing && (firing || keyF) && fireTimer <= 0) { shoot(); fireTimer = fireInterval(); }

  for (const tr of turrets) {
    tr.recoil = Math.max(0, tr.recoil - dt * 40);
    tr.flash = Math.max(0, tr.flash - dt * 8);
    if (!playing) continue;
    tr.timer -= dt;
    if (tr.timer <= 0 && blueCount < MAX_BLUE) {
      tr.timer = fireInterval() * 4;
      const u = makeUnit(0, tr.x + rand(-3, 3), tr.y - 38, 'n');
      u.vx = rand(-15, 15); u.vy = -220;
      units.push(u); blueCount++;
      tr.recoil = 5; tr.flash = 1;
    }
  }
  for (const t of towers) {
    t.shake = Math.max(0, t.shake - dt * 5);
    t.hit = Math.max(0, t.hit - dt);
    t.door = Math.max(0, t.door - dt);
    if (!t.alive || !playing) continue;
    t.timer -= dt;
    if (t.timer <= 0) { spawnWave(t); t.timer = t.interval * rand(0.8, 1.2); }
  }
  moveGates(dt);
  for (const w of defWalls) w.hit = Math.max(0, w.hit - dt);
  for (let i = drops.length - 1; i >= 0; i--) {
    const d = drops[i];
    d.t += dt;
    if (d.t >= 0.6) { drops.splice(i, 1); bombBlast(d.x, d.ty); }
  }

  moveUnits(dt);
  collide();
  gateCheck();
  towerCheck();
  lineCheck();

  let j = 0; blueCount = 0; redCount = 0;
  for (let i = 0; i < units.length; i++) {
    const u = units[i];
    if (!u.alive) continue;
    units[j++] = u;
    if (u.team === 0) blueCount++; else redCount++;
  }
  units.length = j;
  updateFx(dt);

  if (state === 'playing') {
    if (towers.every(t => !t.alive)) { state = 'ending'; endResult = 'win'; endTimer = 1.8; firing = false; celebrate(); }
    else if (baseHp <= 0) { state = 'ending'; endResult = 'lose'; endTimer = 1.4; firing = false; sfx('lose'); }
  } else if (state === 'ending') {
    endTimer -= dt;

// ---------- screens ----------
const OVERLAYS = ['menu', 'pause', 'win', 'lose', 'shop'];
function show(id) { for (const o of OVERLAYS) $(o).classList.toggle('show', o === id); }
function startLevel(n) {
  level = n;
  setupLevel(n);
  show(null);
  // with walls or extra cannons, the player first drags them into place
  if (turrets.length || defWalls.length) state = 'setup';
  else beginBattle(true);
}
function beginBattle(direct) {
  if (!direct && state !== 'setup') return;
  drag = null;
  state = 'playing';
  addText('שלב ' + level, W / 2, 470, '#ffffff', 54, true, 1.6);
  initAudio();
}
function openMenu() {
  state = 'menu';
  writeSave();
  setupLevel(save.level);
  refreshMenu();
  show('menu');
}
function togglePause() {
  if (state === 'playing') { state = 'paused'; firing = false; writeSave(); updateSoundBtn(); show('pause'); }
  else if (state === 'paused') { show(null); state = 'playing'; }
}
function showWin() {
  state = 'won';
  const firstClear = level >= save.maxLevel;
  const ratio = baseHp / baseMax;
  const stars = ratio >= 0.8 ? 3 : ratio >= 0.4 ? 2 : 1;
  // level bonus grows with the level, doubles for 3 stars, and is small on a replay
  addCoins((20 + 6 * level) * [1, 1.5, 2][stars - 1] * (firstClear ? 1 : 0.3));
  save.stars[level] = Math.max(save.stars[level] | 0, stars);
  starCount = starTotal();
  save.level = level + 1;
  save.maxLevel = Math.max(save.maxLevel, level + 1);
  writeSave();
  const st = $('winStars').children;
  for (let i = 0; i < 3; i++) st[i].classList.toggle('on', i < stars);
  $('winStats').textContent = `שלב ${level} הושלם! הרווחתם ${levelCoins} מטבעות`;
  $('winNote').textContent = firstClear ? (stars < 3 ? 'בלי לאבד לבבות מקבלים 3 כוכבים ובונוס כפול' : '') : 'את השלב הזה כבר עברתם, אז הבונוס קטן יותר';
  updateShopHints();
  show('win');
}
function showLose() {
  state = 'lost';
  writeSave();
  const left = towers.reduce((s, t) => s + t.hp, 0) / towers.reduce((s, t) => s + t.maxHp, 0);
  $('loseStats').textContent = left < 0.35 ? 'כמעט! נשאר ממש קצת' : 'טיפ: כוונו לשערים, ושדרגו בחנות';
  updateShopHints();
  show('lose');
}
function updateSoundBtn() { $('soundBtn').textContent = save.muted ? 'צלילים: כבויים' : 'צלילים: פועלים'; }

// character picker: one grid, the VS buttons choose which army you are dressing
let pickTeam = 0;
function buildPicker() {
  const el = $('pickGrid');
  for (const c of el.querySelectorAll('canvas')) c.width = c.height = 0;
  el.textContent = '';
  for (const ch of CHARS) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'tile ' + (pickTeam ? 'red' : 'blue');
    b.dataset.id = ch.id;
    const c = newCanvas(112);
    c.getContext('2d').drawImage(sprite(ch.id, pickTeam), 0, 0, 112, 112);
    const s = document.createElement('span');
    s.textContent = ch.name;
    b.append(c, s);
    if (ch.isNew) { const n = document.createElement('em'); n.textContent = 'חדש'; b.appendChild(n); }
    b.addEventListener('click', () => {
      if (pickTeam) save.red = ch.id; else save.blue = ch.id;
      writeSave(); refreshMenu(); initAudio(); sfx('pop');
    });
    el.appendChild(b);
  }
}
function setPickTeam(t) { if (pickTeam === t) return; pickTeam = t; buildPicker(); refreshMenu(); }
function refreshMenu() {
  const cur = pickTeam ? save.red : save.blue;
  for (const b of $('pickGrid').children) b.classList.toggle('sel', b.dataset.id === cur);
  $('vsBlueBtn').classList.toggle('on', pickTeam === 0);
  $('vsRedBtn').classList.toggle('on', pickTeam === 1);
  $('pickHint').textContent = pickTeam ? 'בוחרים דמות לרעים:' : 'בוחרים דמות לצבא שלי:';
  $('pickDot').style.background = pickTeam ? 'var(--red)' : 'var(--blue)';
  for (const b of $('diff').children) b.classList.toggle('sel', b.dataset.d === save.diff);
  $('diffNote').textContent = DIFF_NOTE[save.diff];
  $('lvlShow').textContent = 'שלב ' + save.level;
  $('lvlMinus').disabled = save.level <= 1;
  $('lvlPlus').disabled = save.level >= save.maxLevel;
  for (const [id, team, cid] of [['vsBlue', 0, save.blue], ['vsRed', 1, save.red]]) {
    const c = $(id), g = c.getContext('2d');
    g.clearRect(0, 0, c.width, c.height);
    g.drawImage(sprite(cid, team), 0, 0, c.width, c.height);
  }
  updateShopHints();
}

// shop
let shopFrom = 'menu';
function priceOf(it) {
  if (it.consumable) return save[it.key] >= it.max ? null : it.price;
  const l = up(it.id);
  return l >= it.prices.length ? null : it.prices[l];
}
function anyAffordable() {
  for (const it of UPGRADES) { const p = priceOf(it); if (p !== null && save.coins >= p) return true; }
  return false;
}
function updateShopHints() {
  const a = anyAffordable();
  for (const id of ['shopBtn1', 'shopBtn2', 'shopBtn3']) $(id).classList.toggle('pulse', a);
  $('winHint').textContent = a ? 'יש לכם מספיק מטבעות לקנות משהו בחנות!' : '';
}
function openShop(from) { shopFrom = from; renderShop(); show('shop'); }
function closeShop() {
  if (shopFrom === 'menu') { setupLevel(save.level); refreshMenu(); } else updateShopHints();
  show(shopFrom);
}
function renderShop() {
  $('shopCoins').textContent = save.coins;
  const gridEl = $('shopGrid');
  for (const c of gridEl.querySelectorAll('canvas')) c.width = c.height = 0;
  gridEl.textContent = '';
  for (const it of UPGRADES) {
    const card = document.createElement('div'); card.className = 'item';
    const ico = document.createElement('div'); ico.className = 'ico';
    if (it.drawIcon) { const c = newCanvas(96); it.drawIcon(c.getContext('2d')); ico.appendChild(c); }
    else ico.textContent = it.icon;
    const txt = document.createElement('div'); txt.className = 'txt';
    const b = document.createElement('b'); b.textContent = it.name;
    const s = document.createElement('small'); s.textContent = it.desc;
    txt.append(b, s);
    if (it.consumable) {
      const have = document.createElement('div'); have.className = 'have';
      have.textContent = `יש לכם ${save[it.key]} מתוך ${it.max}`;
      txt.appendChild(have);
    } else {
      const l = up(it.id), max = it.prices.length;
      const lv = document.createElement('div'); lv.className = 'lvl';
      const bar = document.createElement('div'); bar.className = 'bar';
      const fill = document.createElement('i'); fill.style.width = (l / max * 100) + '%';
      bar.appendChild(fill);
      const sp = document.createElement('span'); sp.textContent = `${l}/${max}`;
      lv.append(bar, sp);
      txt.appendChild(lv);
    }
    const price = priceOf(it);
    const btn = document.createElement('button'); btn.type = 'button'; btn.className = 'buy';
    if (price === null) { btn.textContent = it.consumable ? 'מלא' : 'מקסימום'; btn.disabled = true; btn.classList.add('max'); }
    else {
      const coin = document.createElement('i'); coin.className = 'coin';
      btn.append(coin, document.createTextNode(String(price)));
      btn.disabled = save.coins < price;
      btn.addEventListener('click', () => buy(it));
    }
    card.append(ico, txt, btn);
    gridEl.appendChild(card);
  }
}
function buy(it) {
  initAudio();
  const p = priceOf(it);
  if (p === null || save.coins < p) return;
  save.coins -= p;
  if (it.consumable) save[it.key]++;
  else save.up[it.id] = up(it.id) + 1;
  writeSave();
  sfx('buy');
  renderShop();
}

// buttons that only make sense in battle (or while placing defenses)
const shown = {};
function setShown(id, on, disp) { if (shown[id] !== on) { shown[id] = on; $(id).style.display = on ? disp : 'none'; } }
let lastBombs = -1, lastFreezes = -1;
function syncHud() {
  const battle = state === 'playing' || state === 'paused';
  setShown('bombBtn', battle && save.bombs > 0, 'flex');
  setShown('freezeBtn', battle && save.freezes > 0, 'flex');
  setShown('setupTip', state === 'setup', 'flex');
  setShown('setupBar', state === 'setup', 'flex');
  if (save.bombs !== lastBombs) { lastBombs = save.bombs; $('bombCount').textContent = lastBombs; }
  if (save.freezes !== lastFreezes) { lastFreezes = save.freezes; $('freezeCount').textContent = lastFreezes; }
}

// ---------- input ----------
function toLogical(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  initAudio();
  const p = toLogical(e);
  if (state === 'setup') { startDrag(p, e); return; }
  if (state !== 'playing') return;
  cannon.tx = p.x;
  firing = true;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { /* ignore */ }
  if (fireTimer <= 0) { shoot(); fireTimer = fireInterval(); }
});
canvas.addEventListener('pointermove', e => {
  if (drag) { moveDrag(toLogical(e)); return; }
  if (state === 'playing') cannon.tx = toLogical(e).x;
});
const stopFire = () => { firing = false; endDrag(); };
canvas.addEventListener('pointerup', stopFire);
canvas.addEventListener('pointercancel', stopFire);
window.addEventListener('pointerup', stopFire);
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => { firing = false; keyL = keyR = keyF = false; endDrag(); });
document.addEventListener('visibilitychange', () => { if (document.hidden) { writeSave(); if (state === 'playing') togglePause(); } });
window.addEventListener('pagehide', writeSave);
window.addEventListener('keydown', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') keyL = true;
  else if (c === 'ArrowRight' || c === 'KeyD') keyR = true;
  else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') {
    if (state === 'playing') { keyF = true; initAudio(); e.preventDefault(); }
  }
  else if (c === 'KeyB') useBomb();
  else if (c === 'KeyF') useFreeze();
  else if (c === 'Escape' || c === 'KeyP') togglePause();
  else if (c === 'Enter') {
    if (state === 'setup') beginBattle();
    else if (state === 'menu' && !$('shop').classList.contains('show')) { initAudio(); startLevel(save.level); }
    else if (state === 'won' && $('win').classList.contains('show')) startLevel(save.level);
    else if (state === 'lost' && $('lose').classList.contains('show')) startLevel(level);
  }
});
window.addEventListener('keyup', e => {
  const c = e.code;
  if (c === 'ArrowLeft' || c === 'KeyA') keyL = false;
  else if (c === 'ArrowRight' || c === 'KeyD') keyR = false;
  else if (c === 'Space' || c === 'ArrowUp' || c === 'KeyW') keyF = false;
});

// ---------- boot ----------
resize();
buildPicker();
$('vsBlueBtn').addEventListener('click', () => setPickTeam(0));
$('vsRedBtn').addEventListener('click', () => setPickTeam(1));
for (const b of $('diff').children) b.addEventListener('click', () => { save.diff = b.dataset.d; writeSave(); refreshMenu(); });
$('lvlMinus').addEventListener('click', () => { save.level = Math.max(1, save.level - 1); writeSave(); setupLevel(save.level); refreshMenu(); });
$('lvlPlus').addEventListener('click', () => { save.level = Math.min(save.maxLevel, save.level + 1); writeSave(); setupLevel(save.level); refreshMenu(); });
$('playBtn').addEventListener('click', () => { initAudio(); startLevel(save.level); });
$('setupGo').addEventListener('click', () => beginBattle());
$('resumeBtn').addEventListener('click', togglePause);
$('nextBtn').addEventListener('click', () => startLevel(save.level));
$('retryBtn').addEventListener('click', () => startLevel(level));
for (const id of ['menuBtn1', 'menuBtn2', 'menuBtn3']) $(id).addEventListener('click', openMenu);
$('shopBtn1').addEventListener('click', () => openShop('menu'));
$('shopBtn2').addEventListener('click', () => openShop('win'));
$('shopBtn3').addEventListener('click', () => openShop('lose'));
$('shopBack').addEventListener('click', closeShop);
$('bombBtn').addEventListener('click', useBomb);
$('freezeBtn').addEventListener('click', useFreeze);
$('soundBtn').addEventListener('click', () => { save.muted = !save.muted; writeSave(); updateSoundBtn(); });
$('lvlBtn').addEventListener('click', togglePause);
level = save.level;
setupLevel(level);
refreshMenu();
updateSoundBtn();

let last = performance.now(), slowFor = 0;
function frame(now) {
  const raw = (now - last) / 1000;
  const dt = clamp(raw, 0, 0.05);
  last = now;
  // slow device: if frames keep taking over ~30ms, draw fewer pixels (it never goes back up)
  if (time > 2 && raw > 0.03 && raw < 0.3) slowFor += raw; else if (raw < 0.022) slowFor = Math.max(0, slowFor - raw * 0.5);
  if (slowFor > 1.5 && quality > 0.8) { quality = 0.75; slowFor = 0; resize(); } // one mild step only, so it never turns blurry
  if (state === 'playing' || state === 'ending') update(dt);
  else if (state !== 'paused') idle(dt);
  render();
  syncHud();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
